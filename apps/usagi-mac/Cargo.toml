[package]
name = "usagi-mac"
description = "usAgI for macOS: menu bar rabbit + usage (RunCat style)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "usagi-mac"
path = "src/main.rs"

# macOS 앱에서만 사용하는 의존성
[target.'cfg(target_os = "macos")'.dependencies]
usagi-core = { path = "../../crates/usagi-core" }
serde_json = { version = "1", features = ["preserve_order"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "png-format"] }
tao = "0.37"
tray-icon = "0.26"
# 메뉴 막대 글자 꾸미기 (tray-icon과 같은 objc2 버전)
objc2 = "0.6"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAttributedString", "NSDictionary", "NSString", "NSData", "NSValue", "NSObject", "NSGeometry", "NSUserDefaults", "NSBundle", "NSError"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSAttributedString", "NSFont", "NSFontDescriptor", "NSColor", "NSTextAttachment", "NSImage", "NSAppearance", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSCell", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "NSStringDrawing"] }
# 업데이트를 받을 무작위 이름의 전용 임시 폴더
tempfile = "3"
# 앱 자체 알림 (알림 센터에 usAgI 이름·아이콘으로 표시)
block2 = "0.6"
objc2-user-notifications = "0.3.2"
