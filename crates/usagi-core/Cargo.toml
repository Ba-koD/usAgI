[package]
name = "usagi-core"
description = "usAgI shared core: Claude Code log reader, limit estimation, nap forecast, rabbit renderer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
memchr = "2"
jiff = "0.2"
toml = "0.8"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
tempfile = "3"
# 업데이트 서명 검증 (minisign, Ed25519). 의존성 없는 검증 전용
minisign-verify = "0.3"
notify = "8.2.0"

[features]
# 테스트 빌드: CLI·네트워크 없이 가짜 사용량을 보내는 엔진 (실제 앱과 같이 띄워 화면 확인용)
mock = []

[dev-dependencies]
# 테스트에서 서명을 직접 만들어 검증 (앱에는 들어가지 않음)
minisign = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_Shell"] }

# 테스트에서 Windows 인터넷 옵션의 프록시를 바꿔 실제 경로를 확인 (앱에는 들어가지 않음)
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinInet"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "~3.2.0", default-features = false, features = ["native-tls"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
ureq = { version = "~3.2.0", default-features = false, features = ["rustls"] }

# 시스템 프록시 설정 읽기 (네트워크 설정·PAC). 메뉴 막대 앱이 이미 쓰는 objc2와 같은 버전
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDate", "CFDictionary", "CFError", "CFNumber", "CFRunLoop", "CFStream", "CFString", "CFURL"] }
objc2-cf-network = { version = "0.3.2", default-features = false, features = ["std", "CFProxySupport"] }
