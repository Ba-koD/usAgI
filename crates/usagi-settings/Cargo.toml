[package]
name = "usagi-settings"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = "1"
usagi-core = { path = "../usagi-core" }
slint = { version = "~1.17.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "unstable-winit-030"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "~1.17.0"
