[workspace]
resolver = "2"
members = ["crates/usagi-core", "crates/usagi-settings", "apps/usagi-win", "apps/usagi-mac", "tools/usagi-sign"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
