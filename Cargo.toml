[workspace]
resolver = "2"
members = ["crates/usagi-core", "crates/usagi-settings", "apps/usagi-win", "apps/usagi-mac", "tools/usagi-sign"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
# 나눠서 최적화(thin LTO): 전체를 한 덩어리로 최적화할 때보다 다시 빌드하는 시간이 절반쯤 (실행 파일은 약 13% 커짐)
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
