# main 푸시·PR 확인: 공통 로직 테스트 + 플랫폼 앱 컴파일 확인 (세 OS 동시에)
#
# - 실제 릴리스 빌드와 묶기는 release.yml(Build & Release)이 해요. 버전을 올린 커밋을 main에 올렸을 때만
#   빌드하고, 그 밖의 main 푸시는 여기서 가볍게 확인만 해요.
# - 릴리스 최적화(LTO) 없이 cargo check로 컴파일만 확인해서 빨라요.
# - Windows·macOS는 실제 GitHub 릴리스로 업데이트를 받아 검증하고, OS 프록시를 거쳐서도 받아지는지 확인해요.
# - Linux 줄은 앱이 아직 없어서 공통 로직과 서명 도구만 (게시 단계가 Linux에서 서명 도구를 빌드하므로 미리 확인).
# - Linux 줄은 업데이트 공개 키가 고정 값과 같은지, 설치 스크립트에 넣은 키도 같은지 확인해요 (scripts/check-update-key.sh).
#   그래서 설치 스크립트만 바뀌어도 돌아요.
# - 같은 브랜치·PR에 새로 올리면 이전 실행은 취소해요. 문서만 바뀌면 돌지 않아요.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "scripts/release.ps1"]
  pull_request:
    paths-ignore: ["**.md", "scripts/release.ps1"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # 디버그 정보 없이: 테스트·컴파일 확인이 빠르고 캐시가 작아짐
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (공통 로직 · 서명 도구)
            os: ubuntu-latest
            app: usagi-sign
          - name: Windows
            os: windows-latest
            app: usagi-win
          - name: macOS
            os: macos-latest
            app: usagi-mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 업데이트 공개 키 고정 확인
        if: runner.os == 'Linux'
        run: bash scripts/check-update-key.sh

      # 릴리스 본문의 검증 정보를 만들고 읽는 스크립트 (게시·수동 재서명이 사용)
      - name: 릴리스 검증 정보 스크립트 확인
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/test-release-verification.ps1

      # 러너에 설치된 rustup을 그대로 씀 (서드파티 액션을 거치지 않음)
      - name: Rust 준비
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # 서드파티 액션은 태그가 아니라 커밋으로 고정
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-${{ matrix.os }}

      - name: 공통 로직 테스트
        run: cargo test -p usagi-core --locked

      # 앱과 같은 코드로 실제 GitHub 최신 릴리스를 확인 → 받기 → 체크섬·서명 검증 (설치 적용은 하지 않음).
      # 토큰은 러너끼리 나눠 쓰는 API 요청 한도를 피하려고만 쓰고, 처음 주소(api.github.com)에만 보냄
      - name: 업데이트 실제 확인
        if: runner.os != 'Linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo test -p usagi-core --locked real_release_downloads_and_verifies -- --ignored

      # OS 프록시를 테스트 프록시(127.0.0.1:18080)로 맞춘 뒤 실제 업데이트가 그 프록시를 거치는지 확인.
      # 러너 전체 설정이 바뀌므로 한 단계 안에서 설정 → 실행 → 되돌림 (Windows는 테스트가 인터넷 옵션을 바꾸고 끝나면 되돌림)
      - name: 시스템 프록시 경유 확인 (macOS)
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USAGI_PROXY_E2E: 127.0.0.1:18080
        shell: bash
        run: |
          cargo test -p usagi-core --locked --no-run
          services=()
          while IFS= read -r line; do services+=("${line#\*}"); done < <(networksetup -listallnetworkservices | tail -n +2)
          reset() { for s in "${services[@]}"; do sudo networksetup -setsecurewebproxystate "$s" off || true; done; }
          trap reset EXIT
          for s in "${services[@]}"; do
            sudo networksetup -setsecurewebproxy "$s" 127.0.0.1 18080 && sudo networksetup -setsecurewebproxystate "$s" on || true
          done
          sleep 2
          cargo test -p usagi-core --locked real_update_goes_through_the_system_proxy -- --ignored

      - name: 시스템 프록시 경유 확인 (Windows)
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USAGI_PROXY_E2E: 127.0.0.1:18080
        run: cargo test -p usagi-core --locked real_update_goes_through_the_system_proxy -- --ignored

      - name: 앱 컴파일 확인
        if: matrix.app != ''
        env:
          APP: ${{ matrix.app }}
        shell: bash
        run: |
          args=(-p "$APP")
          if [[ "$APP" == usagi-win || "$APP" == usagi-mac ]]; then args+=(-p usagi-settings); fi
          cargo check "${args[@]}" --locked
