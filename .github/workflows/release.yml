# 자동 빌드 · 릴리스
#
#   main에 올리면   준비 → 빌드(Windows·macOS 동시에)            산출물은 실행 페이지에서 받기 (게시 안 함)
#   태그(v*) 올리면 준비 → 빌드(Windows·macOS 동시에) → 게시      GitHub 릴리스 + Homebrew 탭
#   수동 실행       기본은 빌드만. 태그를 골라 "publish"를 켜면 그 태그로 게시
#
# 왜 이렇게 나눴나
#   - 준비(몇 초, Rust 없음): 태그와 버전이 다르면 비싼 러너를 띄우기 전에 바로 멈춰요.
#   - 빌드: 설정 화면 처리·사용량·알림 판단이 모두 usagi-core 하나라서 플랫폼 job은 서로 기다리지 않고
#     동시에 돌고, 각자 자기 OS에서 공통 로직 테스트 → 앱 컴파일 → 묶기만 해요.
#     (컴파일 결과는 OS마다 달라 나눠 쓸 수 없어요. 대신 OS별 캐시로 의존성 재빌드를 건너뛰어요.)
#   - main에서도 같은 묶기 스크립트를 돌리므로 릴리스 날에 처음 깨지는 일이 없고, main이 저장한 캐시를
#     태그 빌드가 그대로 받아 써요. (GitHub 캐시는 태그끼리 공유되지 않아서 태그 빌드는 저장하지 않아요.)
#   - 게시: 모든 파일을 초안 릴리스에 올린 뒤 한 번에 공개해요. 앱의 자동 업데이트가
#     파일이 덜 올라간 릴리스를 보는 일이 없어요.
#   - Linux 앱이 생기면 build의 matrix에 한 줄만 더하면 돼요.
name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # 문서만 바뀐 main 푸시는 건너뜀 (태그 푸시에는 경로 필터가 적용되지 않아 항상 돌아요)
    paths-ignore: ["**.md", "scripts/install-mac.sh", "scripts/release.ps1"]
  workflow_dispatch:
    inputs:
      publish:
        description: "릴리스까지 게시 (태그를 골라 실행할 때만)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # main은 새로 올리면 이전 실행을 취소, 태그(릴리스)는 끝까지
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # 앱이 업데이트를 확인할 저장소 = 이 저장소 (빌드 때 실행 파일에 들어감)
  USAGI_UPDATE_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: 준비 (버전·노트)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 버전 확인
        id: ver
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          WANT_PUBLISH: ${{ inputs.publish }}
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          publish=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$ver" ]]; then
              echo "::error::Cargo.toml 버전(v$ver)과 태그($GITHUB_REF_NAME) 불일치"
              exit 1
            fi
            if [[ "$EVENT" == "push" || "$WANT_PUBLISH" == "true" ]]; then publish=true; fi
          fi
          if [[ "$publish" == "true" ]] && ! grep -qF "## [$ver]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md에 '## [$ver] - 날짜' 섹션 없음"
            exit 1
          fi
          prerelease=false
          [[ "$ver" == *-* ]] && prerelease=true
          {
            echo "version=$ver"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "버전 $ver · 게시 $publish · 미리보기 $prerelease"

      - name: 릴리스 노트 (CHANGELOG.md에서)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/release-notes.sh "$VERSION" > notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md
          retention-days: 7

  build:
    name: 빌드 (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # 태그(릴리스)는 하나라도 실패하면 바로 멈추고, main에서는 다른 플랫폼 결과도 끝까지 봄
      fail-fast: ${{ github.ref_type == 'tag' }}
      matrix:
        include:
          - name: Windows
            os: windows-latest
            targets: ""
          - name: macOS
            os: macos-latest
            # Intel + Apple Silicon 유니버설 (한 번의 cargo 호출로 두 타깃을 함께 빌드)
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Linux 앱이 생기면:
          # - name: Linux
          #   os: ubuntu-latest
          #   targets: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 러너에 설치된 rustup을 그대로 씀 (서드파티 액션을 거치지 않음)
      - name: Rust 준비
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          if [ -n "$TARGETS" ]; then
            IFS=',' read -ra list <<< "$TARGETS"
            rustup target add "${list[@]}"
          fi

      # 서드파티 액션은 태그가 아니라 커밋으로 고정 (태그는 바뀔 수 있음)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.name }}
          # 태그에서 저장한 캐시는 다른 태그가 못 써서 용량만 차지함 → main에서만 저장
          save-if: ${{ github.ref_type != 'tag' }}

      - name: 공통 로직 테스트 (이 OS에서)
        run: cargo test -p usagi-core --locked

      - name: Windows 빌드·묶기 (exe, 포터블 zip, 체크섬)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-portable.ps1

      - name: macOS 빌드·묶기 (.app zip, 고정 이름 zip, 체크섬)
        if: runner.os == 'macOS'
        run: bash scripts/package-mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 게시
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: 파일 확인 + 체크섬 모음
        working-directory: out
        run: |
          for f in usagi.exe usagi.exe.sha256 usAgI-mac.zip usAgI-mac.zip.sha256 notes.md; do
            [[ -s "$f" ]] || { echo "::error::$f 없음"; exit 1; }
          done
          ls usAgI-portable-*.zip usAgI-mac-*.zip >/dev/null
          sha256sum usagi.exe usAgI-portable-*.zip usAgI-mac-*.zip usAgI-mac.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 릴리스 만들기 (초안에 모두 올린 뒤 공개)
        working-directory: out
        run: |
          files=(usagi.exe usagi.exe.sha256 usAgI-portable-*.zip usAgI-mac-*.zip usAgI-mac.zip usAgI-mac.zip.sha256 SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 다시 실행한 경우: 파일과 노트만 바꿔 올림
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            flags=(--title "usAgI $TAG" --notes-file notes.md --verify-tag --draft)
            [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}" "${files[@]}"
          fi
          gh release edit "$TAG" --draft=false
          echo "릴리스: $(gh release view "$TAG" --json url -q .url)"

      - name: Homebrew 탭 갱신 (HOMEBREW_TAP_TOKEN 비밀값이 있을 때만, 미리보기 버전은 제외)
        if: env.HAS_TAP_TOKEN == 'true' && needs.prepare.outputs.prerelease != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash scripts/update-homebrew-tap.sh "$TAG" out/usAgI-mac-*.zip
