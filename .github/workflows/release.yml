# 자동 빌드 · 릴리스
#
#   태그(v*) 올리면 준비 → Windows·Mac ARM·Mac Intel 병렬 빌드 → Mac 앱 묶기 → 게시
#   수동 실행       기본은 빌드만 (산출물은 실행 페이지에서 받기). 태그를 골라 "publish"를 켜면 그 태그로 게시
#   main에 올리면   여기서는 아무것도 안 함. ci.yml이 테스트와 컴파일 확인만 해요.
#
# 왜 이렇게 나눴나
#   - 준비(몇 초, Rust 없음): 태그와 버전이 다르면 비싼 러너를 띄우기 전에 바로 멈춰요.
#   - Windows와 Mac ARM에서 공통 테스트 실행. Mac은 두 타깃의 바이너리를 별도 러너에서 빌드하고
#     Mac 앱 묶기 단계에서 합쳐요. 앱 묶기는 Windows 빌드를 기다리지 않아요.
#   - main에서 수동 실행하면 같은 타깃·Cargo 프로필의 릴리스 의존성 캐시가 준비돼요.
#     태그 빌드는 기본 브랜치 캐시를 받아 쓰고, 태그 범위에 새 캐시는 저장하지 않아요.
#   - 게시: 모든 파일을 초안 릴리스에 올린 뒤 한 번에 공개해요. 앱의 자동 업데이트가
#     파일이 덜 올라간 릴리스를 보는 일이 없어요.
name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "릴리스까지 게시 (태그를 골라 실행할 때만)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # 수동 실행은 같은 브랜치에서 다시 돌리면 이전 실행을 취소, 태그(릴리스)는 끝까지
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # 앱이 업데이트를 확인할 저장소 = 이 저장소 (빌드 때 실행 파일에 들어감)
  USAGI_UPDATE_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: 준비 (버전·노트)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      publish: ${{ steps.ver.outputs.publish }}
      cache_profile: ${{ steps.ver.outputs.cache_profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 버전 확인
        id: ver
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          WANT_PUBLISH: ${{ inputs.publish }}
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          publish=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$ver" ]]; then
              echo "::error::Cargo.toml 버전(v$ver)과 태그($GITHUB_REF_NAME) 불일치"
              exit 1
            fi
            if [[ "$EVENT" == "push" || "$WANT_PUBLISH" == "true" ]]; then publish=true; fi
          fi
          if [[ "$publish" == "true" ]] && ! grep -qF "## [$ver]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md에 '## [$ver] - 날짜' 섹션 없음"
            exit 1
          fi
          prerelease=false
          [[ "$ver" == *-* ]] && prerelease=true
          # 버전 번호와 별도로 최적화·테스트 프로필이 바뀌면 새 캐시 그룹 사용.
          cache_profile=$(awk '
            /^[[:space:]]*\[/ { profile = ($0 ~ /^[[:space:]]*\[profile\./) }
            profile && $0 !~ /^[[:space:]]*(#|$)/ { print }
          ' Cargo.toml | sha256sum | cut -c1-12)
          {
            echo "version=$ver"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
            echo "cache_profile=$cache_profile"
          } >> "$GITHUB_OUTPUT"
          echo "버전 $ver · 게시 $publish · 미리보기 $prerelease"

      - name: 릴리스 노트 (CHANGELOG.md에서)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/release-notes.sh "$VERSION" > notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist-notes
          path: notes.md
          retention-days: 7

  windows:
    name: 빌드 (Windows)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rust 준비
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-windows-${{ needs.prepare.outputs.cache_profile }}
          save-if: ${{ github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch' }}

      - name: 공통 로직 테스트 (이 OS에서)
        run: cargo test -p usagi-core --locked

      - name: Windows 빌드 (exe, 체크섬)
        shell: pwsh
        run: ./scripts/package-portable.ps1 -ReleaseOnly

      - uses: actions/upload-artifact@v4
        with:
          name: dist-Windows
          path: |
            dist/release/usagi.exe
            dist/release/usagi.exe.sha256
          compression-level: 1
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: timings-Windows
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 7

  mac-build:
    name: 빌드 (macOS · ${{ matrix.target }})
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: ${{ github.ref_type == 'tag' }}
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rust 준비
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.target }}-${{ needs.prepare.outputs.cache_profile }}
          save-if: ${{ github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch' }}

      - name: 공통 로직 테스트 (이 OS에서)
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test -p usagi-core --locked

      - name: macOS 바이너리 빌드
        run: cargo build --locked --release --timings -p usagi-mac --target "$TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/usagi-mac
          compression-level: 1
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: timings-${{ matrix.target }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 7

  mac-package:
    name: macOS 유니버설 앱 묶기
    needs: mac-build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: mac-bin-*
          path: mac-binaries

      - name: Mac 앱 묶기 (.app zip, 체크섬)
        run: |
          bash scripts/package-mac.sh \
            mac-binaries/mac-bin-aarch64-apple-darwin/usagi-mac \
            mac-binaries/mac-bin-x86_64-apple-darwin/usagi-mac

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macOS
          path: |
            dist/release/usAgI-mac.zip
            dist/release/usAgI-mac.zip.sha256
          # ZIP은 이미 압축 완료
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 게시
    needs: [prepare, windows, mac-package]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.prepare.outputs.version }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      HAS_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: out
          merge-multiple: true

      - name: 게시 파일 확인
        working-directory: out
        run: |
          for f in usagi.exe usagi.exe.sha256 usAgI-mac.zip usAgI-mac.zip.sha256 notes.md; do
            [[ -s "$f" ]] || { echo "::error::$f 없음"; exit 1; }
          done

      # 업데이트 서명: 앱에 들어 있는 공개 키(packaging/usagi-update.pub)와 짝인 비밀 키로 파일마다 .minisig 생성.
      # 설치된 앱은 서명이 없거나 맞지 않는 업데이트를 받지 않으므로, 공개 키가 있는데 비밀값이 없으면 게시하지 않고 실패.
      # 비밀 키는 이 단계에만 전달 (다른 단계·서드파티 액션에는 보이지 않음)
      - name: 서명 (.minisig)
        id: sign
        env:
          USAGI_SIGN_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          USAGI_SIGN_PASSWORD: ${{ secrets.UPDATE_SIGNING_PASSWORD }}
        run: |
          if ! grep -qvE '^(untrusted comment:.*|#.*|[[:space:]]*)$' packaging/usagi-update.pub; then
            echo "서명 공개 키 없음: 서명 건너뜀"
            exit 0
          fi
          if [[ "$HAS_SIGNING_KEY" != "true" ]]; then
            echo "::error::packaging/usagi-update.pub에 공개 키가 있는데 UPDATE_SIGNING_KEY 비밀값이 없음 (서명 없는 릴리스는 앱이 받지 않음)"
            exit 1
          fi
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          key="$RUNNER_TEMP/update-signing.key"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$USAGI_SIGN_KEY" > "$key")
          cargo run --quiet --locked -p usagi-sign -- sign --version "$VERSION" --key "$key" \
            out/usagi.exe out/usAgI-mac.zip
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: 릴리스 본문에 파일 검증 정보 추가
        shell: pwsh
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          . ./scripts/release-verification.ps1
          $names = @('usagi.exe', 'usAgI-mac.zip')
          $block = New-ReleaseVerificationBlock -Directory out -Names $names -Signed:($env:SIGNED -eq 'true')
          $body = Get-Content -LiteralPath out/notes.md -Raw -Encoding utf8
          Set-Content -LiteralPath out/notes.md -Value (Set-ReleaseVerificationBlock $body $block) -Encoding utf8NoBOM

      - name: 릴리스 만들기 (초안에 모두 올린 뒤 공개)
        working-directory: out
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          files=(usagi.exe usAgI-mac.zip)
          # 0.3.0은 첨부를 읽는 구버전도 자동으로 설치할 수 있게 게시.
          base_version="${VERSION%%-*}"
          if [[ "$(printf '%s\n' "$base_version" 0.3.0 | sort -V | tail -n1)" == 0.3.0 ]]; then
            files+=(usagi.exe.sha256 usAgI-mac.zip.sha256)
            if [[ "$SIGNED" == "true" ]]; then
              files+=(usagi.exe.minisig usAgI-mac.zip.minisig)
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 다시 실행한 경우: 파일과 노트만 바꿔 올림
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            flags=(--title "usAgI $TAG" --notes-file notes.md --verify-tag --draft)
            [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}" "${files[@]}"
          fi
          gh release edit "$TAG" --draft=false
          echo "릴리스: $(gh release view "$TAG" --json url -q .url)"

      - name: Homebrew 탭 갱신 (HOMEBREW_TAP_TOKEN 비밀값이 있을 때만, 미리보기 버전은 제외)
        if: env.HAS_TAP_TOKEN == 'true' && needs.prepare.outputs.prerelease != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash scripts/update-homebrew-tap.sh "$TAG" out/usAgI-mac.zip
